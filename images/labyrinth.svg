<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <style>
      .labyrinth-path {
        fill: none;
        stroke: #8b7355;
        stroke-width: 2;
        stroke-linecap: round;
      }
      .center-dot {
        fill: #8b7355;
      }
    </style>
  </defs>
  
  <!-- Classical 7-circuit labyrinth -->
  <g transform="translate(100, 100)">
    <!-- Outer paths -->
    <path class="labyrinth-path" d="M 0,-90 A 90,90 0 0,1 90,0" />
    <path class="labyrinth-path" d="M 90,0 A 90,90 0 0,1 0,90" />
    <path class="labyrinth-path" d="M 0,90 A 90,90 0 0,1 -90,0" />
    <path class="labyrinth-path" d="M -90,0 A 90,90 0 0,1 0,-90" />
    
    <!-- Inner circuits -->
    <path class="labyrinth-path" d="M 0,-70 A 70,70 0 0,0 -70,0" />
    <path class="labyrinth-path" d="M -70,0 A 70,70 0 0,0 0,70" />
    <path class="labyrinth-path" d="M 0,70 A 70,70 0 0,0 70,0" />
    <path class="labyrinth-path" d="M 70,0 A 70,70 0 0,0 0,-70" />
    
    <path class="labyrinth-path" d="M 0,-50 A 50,50 0 0,1 50,0" />
    <path class="labyrinth-path" d="M 50,0 A 50,50 0 0,1 0,50" />
    <path class="labyrinth-path" d="M 0,50 A 50,50 0 0,1 -50,0" />
    <path class="labyrinth-path" d="M -50,0 A 50,50 0 0,1 0,-50" />
    
    <path class="labyrinth-path" d="M 0,-30 A 30,30 0 0,0 -30,0" />
    <path class="labyrinth-path" d="M -30,0 A 30,30 0 0,0 0,30" />
    <path class="labyrinth-path" d="M 0,30 A 30,30 0 0,0 30,0" />
    <path class="labyrinth-path" d="M 30,0 A 30,30 0 0,0 0,-30" />
    
    <!-- Center -->
    <circle class="center-dot" cx="0" cy="0" r="8" />
    <circle class="labyrinth-path" cx="0" cy="0" r="15" />
  </g>
</svg>
