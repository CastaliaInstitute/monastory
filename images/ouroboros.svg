<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <style>
      .serpent-body {
        fill: none;
        stroke: #8b7355;
        stroke-width: 8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .serpent-detail {
        fill: none;
        stroke: #a89080;
        stroke-width: 2;
      }
      .serpent-eye {
        fill: #8b7355;
      }
      .serpent-scale {
        fill: none;
        stroke: #a89080;
        stroke-width: 1;
        opacity: 0.6;
      }
    </style>
  </defs>
  
  <!-- Ouroboros - serpent eating its tail -->
  <g transform="translate(100, 100)">
    <!-- Main circular body -->
    <circle class="serpent-body" cx="0" cy="0" r="70" />
    
    <!-- Inner circle for depth -->
    <circle class="serpent-detail" cx="0" cy="0" r="66" />
    <circle class="serpent-detail" cx="0" cy="0" r="74" />
    
    <!-- Scales pattern -->
    <g class="serpent-scale">
      <path d="M 0,-70 Q 5,-65 0,-60" />
      <path d="M 15,-68 Q 20,-63 15,-58" />
      <path d="M 30,-64 Q 35,-59 30,-54" />
      <path d="M 44,-58 Q 49,-53 44,-48" />
      <path d="M 56,-48 Q 61,-43 56,-38" />
      <path d="M 66,-36 Q 71,-31 66,-26" />
      <path d="M 72,-22 Q 77,-17 72,-12" />
      <path d="M 74,-8 Q 79,-3 74,2" />
      <path d="M 74,8 Q 79,13 74,18" />
      <path d="M 72,22 Q 77,27 72,32" />
      <path d="M 66,36 Q 71,41 66,46" />
      <path d="M 56,48 Q 61,53 56,58" />
      <path d="M 44,58 Q 49,63 44,68" />
      <path d="M 30,64 Q 35,69 30,74" />
    </g>
    
    <!-- Head of serpent -->
    <g transform="rotate(-45)">
      <ellipse class="serpent-body" cx="70" cy="0" rx="12" ry="8" />
      <circle class="serpent-eye" cx="75" cy="-2" r="2" />
      
      <!-- Mouth opening to bite tail -->
      <path class="serpent-detail" d="M 62,0 L 68,0" />
      <path class="serpent-detail" d="M 65,-3 L 65,3" />
    </g>
    
    <!-- Tail being consumed -->
    <g transform="rotate(135)">
      <path class="serpent-body" d="M 70,0 L 80,0" stroke-width="6" />
      <path class="serpent-body" d="M 80,0 L 85,0" stroke-width="4" />
    </g>
    
    <!-- Central symbol - infinity or cycle -->
    <g opacity="0.4">
      <path class="serpent-detail" d="M -20,0 Q -10,-15 0,0 Q 10,15 20,0" stroke-width="1.5" />
      <circle class="serpent-eye" cx="-10" cy="0" r="1.5" />
      <circle class="serpent-eye" cx="10" cy="0" r="1.5" />
    </g>
  </g>
</svg>
